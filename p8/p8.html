<!DOCTYPE html>
<html>
<head>
    <title>Sticky Navbar</title>
    <link rel="stylesheet" href="style.css">
    <style>

nav {
    position: sticky;
    top: 0;
    background-color: black;
    color: white;
    padding: 15px;
}
nav a {
    color: white;
    margin: 10px;
}
.card {
    position: relative;
    width: 400px;
}
.card img {
    width: 100%;
}
.overlay {
    position: absolute;
    bottom: 0;
    background-color: black;
    color: white;
    width: 100%;
    text-align: center;
}
</style>
</head>
<body>

<nav>
    <h2>My Portfolio</h2>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Projects</a>
</nav>

<main>
    <h1>Welcome to My Portfolio</h1>

    <div class="card">
        <img src="https://via.placeholder.com/400x200"
        alt="Project image">

        <div class="overlay">
            <h2>My Project</h2>
            <p>HTML and CSS Project</p>
        </div>
    </div>

    <p>Scroll down to see the sticky navbar.</p>
    <p>Web Development Portfolio</p>
</main>
</body>
</html>
