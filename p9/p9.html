<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Layout</title>

    <style>
        body {
            font-family: Arial;
        }

        nav {
            display: flex;
            justify-content: space-around;
            background-color: black;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card {
            background-color: lightblue;
            padding: 30px;
            width: 200px;
            text-align: center;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 10px;
            }

            .card {
                width: 100%;
            }
        }
    </style>

</head>
<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
    </nav>

    <h1>My Projects</h1>

    <div class="container">

        <div class="card">Project 1</div>

        <div class="card">Project 2</div>

        <div class="card">Project 3</div>

    </div>

</body>
</html>
