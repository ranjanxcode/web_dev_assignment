<!DOCTYPE html>
<html>
<head>
    <title>Typography System</title>

    <style>
        :root {
            --main-color: blue;
            --text-color: black;
            --font-size: 18px;
        }

        body {
            font-family: Arial;
            color: var(--text-color);
        }

        h1 {
            color: var(--main-color);
            font-size: 35px;
        }

        p {
            font-size: var(--font-size);
        }

        button {
            background-color: var(--main-color);
            color: white;
            padding: 10px;
        }
    </style>

</head>
<body>

    <h1>My Website</h1>

    <p>Welcome to my website.</p>

    <button>Click Here</button>

</body>
</html>
