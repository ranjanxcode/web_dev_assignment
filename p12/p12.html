<!DOCTYPE html>
<html>
<head>
    <title>Projects Grid</title>

    <style>
        body {
            font-family: Arial;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .card {
            background-color: lightblue;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>
<body>

    <h1>My Projects</h1>

    <div class="container">

        <div class="card">
            <h2>Project 1</h2>
            <p>Portfolio Website</p>
        </div>

        <div class="card">
            <h2>Project 2</h2>
            <p>Login Page</p>
        </div>

        <div class="card">
            <h2>Project 3</h2>
            <p>Calculator</p>
        </div>

        <div class="card">
            <h2>Project 4</h2>
            <p>Landing Page</p>
        </div>

        <div class="card">
            <h2>Project 5</h2>
            <p>Blog Website</p>
        </div>

        <div class="card">
            <h2>Project 6</h2>
            <p>Shopping Website</p>
        </div>

    </div>

</body>
</html>
