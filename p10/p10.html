<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio Header and Footer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e293b;
            color: white;
            padding: 15px 30px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        main {
            flex: 1;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        .projects {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card {
            background-color: #e2e8f0;
            padding: 25px;
            flex: 1 1 220px;
            max-width: 280px;
            border-radius: 6px;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e293b;
            color: white;
            padding: 15px 30px;
        }

        .footer-links {
            display: flex;
            gap: 15px;
        }

        .footer-links a {
            color: #cbd5e1;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            header,
            footer {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            nav {
                flex-direction: column;
                gap: 10px;
            }

            .card {
                max-width: 100%;
            }
        }
    </style>

</head>
<body>

    <header>
        <div class="logo">My Portfolio</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Featured Work</h1>

        <div class="projects">
            <div class="card">
                <h3>Bio Page</h3>
                <p>Built with semantic HTML tags.</p>
            </div>
            <div class="card">
                <h3>Design System</h3>
                <p>Styled using CSS variables and fonts.</p>
            </div>
            <div class="card">
                <h3>Flexbox Grid</h3>
                <p>Responsive layout for mobile and desktop.</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 My Portfolio</p>
        <div class="footer-links">
            <a href="#">GitHub</a>
            <a href="#">LinkedIn</a>
        </div>
    </footer>

</body>
</html>
